spring.application.name=Batching-Work

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/testemployeedb
spring.datasource.username=postgres
spring.datasource.password=CredAi@abhinav
spring.datasource.driver-class-name=org.postgresql.Driver

# Application tables are generated from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Batch metadata tables
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true

# Logging
logging.level.org.springframework.boot.autoconfigure.batch=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Input file
employee.csv.path=src/main/resources/employees_100.csv

# Maximum file size: 5 MB
employee.csv.max-size=5242880

# Expected CSV headers
employee.csv.headers=employeeId,name,email,salary